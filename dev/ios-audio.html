<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>iOS soundtrack ducking repro (dev only)</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, system-ui, sans-serif; }
    body { margin: 0; padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); background: #140d07; color: #ece0ca; }
    h1 { font-size: 1.05rem; margin: 0 0 4px; }
    p { margin: 0 0 10px; font-size: 0.85rem; color: #b6a07d; }
    fieldset { border: 1px solid #8a6636; border-radius: 8px; margin: 0 0 10px; padding: 8px; }
    legend { font-size: 0.8rem; color: #b6a07d; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    button, select { font: inherit; font-size: 0.95rem; padding: 8px 10px; border-radius: 6px; border: 1px solid #8a6636; background: #271a10; color: inherit; }
    button:active { background: #3a2716; }
    label { font-size: 0.9rem; display: inline-flex; gap: 6px; align-items: center; }
    #status { font: 0.8rem ui-monospace, Menlo, monospace; white-space: pre-wrap; margin: 0 0 10px; }
    #log { font: 0.72rem ui-monospace, Menlo, monospace; white-space: pre-wrap; max-height: 45vh; overflow: auto; background: #0c0703; border-radius: 6px; padding: 6px; }
  </style>
</head>
<body>
  <h1>Soundtrack ducking repro</h1>
  <p>Development only (not part of the build). Test with the screen locked and <strong>without</strong> Web Inspector attached, then copy the log.</p>

  <fieldset>
    <legend>Setup (applies on “Start music”)</legend>
    <div class="row">
      <label>Music output
        <select id="backend">
          <option value="graph">GainNode (enhanced)</option>
          <option value="native">Native element (compat)</option>
        </select>
      </label>
      <label><input type="checkbox" id="session" checked /> audioSession “playback”</label>
      <label>Music source
        <select id="source">
          <option value="network">Network (R2)</option>
          <option value="cache">Cache API (if downloaded by the app)</option>
        </select>
      </label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Music</legend>
    <div class="row">
      <button id="music-start">Start music</button>
      <button id="music-pause">Pause/resume</button>
      <button id="music-stop">Stop &amp; tear down</button>
      <label>Volume <input type="range" id="volume" min="0" max="100" value="100" /></label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Narration</legend>
    <div class="row">
      <select id="narration"></select>
      <select id="rate">
        <option value="1">1×</option>
        <option value="1.15">1.15×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
      </select>
      <button id="nar-play">Play</button>
      <button id="nar-pause">Pause</button>
      <button id="nar-stop">Stop</button>
      <button id="nar-seek">Seek +10 s</button>
    </div>
    <div class="row" style="margin-top:6px">
      <button id="cycles">Run 10 cycles (lock now)</button>
      <label>Gap <select id="gap"><option value="15">15 s</option><option value="30" selected>30 s</option><option value="60">60 s</option></select></label>
    </div>
  </fieldset>

  <div class="row" style="margin-bottom:8px">
    <button id="copy">Copy log</button>
    <button id="clear">Clear log</button>
  </div>
  <div id="status"></div>
  <div id="log"></div>

  <script type="module" src="./ios-audio.js"></script>
</body>
</html>
